version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    expose:
      - "4173"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - ./backend/data:/app/data

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

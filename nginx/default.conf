upstream frontend_app {
    server frontend:4173;
}

upstream backend_app {
    server backend:8000;
}

server {
    listen 80;
    server_name potencore.ru www.potencore.ru;
    return 301 https://potencore.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.potencore.ru;

    ssl_certificate /etc/letsencrypt/live/potencore.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/potencore.ru/privkey.pem;

    return 301 https://potencore.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name potencore.ru;

    client_max_body_size 10m;

    ssl_certificate /etc/letsencrypt/live/potencore.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/potencore.ru/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
